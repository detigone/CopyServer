name: CopyServer CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Parse Vencord plugin TSX source
        run: npx esbuild serverCloner/index.tsx --loader:.tsx=tsx --outfile=/tmp/CopyServer-plugin-check.js
      - name: Run unit tests
        run: npm test
      - name: Type-check simulator
        run: npm run lint
      - name: Build simulator
        run: npm run build
